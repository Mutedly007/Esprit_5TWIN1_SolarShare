# =====================================================================
# SonarQube Configuration for SolarShare (Laravel 12 / PHP 8.2)
# =====================================================================

# Project Identification
sonar.projectKey=SolarShare
sonar.projectName=SolarShare
sonar.projectVersion=1.0

# Source & Test Directories
sonar.sources=app,resources/js,routes
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Web Service Socket & Connect Timeouts (prevents SocketTimeoutException during rule search)
sonar.scanner.socketTimeout=300
sonar.scanner.connectTimeout=60
sonar.ws.timeout=300

# Code Coverage Integration (PHPUnit Clover XML)
sonar.php.coverage.reportPaths=coverage.xml

# Exclusions
# Ignore third-party vendor libraries, compiled assets, cache, database migrations/seeders, blade templates, and storage
sonar.exclusions=vendor/**,node_modules/**,storage/**,bootstrap/cache/**,public/**,public/build/**,database/**,resources/views/**,**/*.blade.php,**/*.min.js,**/*.min.css

# Test Inclusions
sonar.test.inclusions=tests/**/*Test.php,tests/**/*.php

# SCM Provider Configuration (disable SCM blame during local scans for performance)
sonar.scm.disabled=true
