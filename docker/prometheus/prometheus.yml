global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Prometheus Internal Metrics
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. cAdvisor (Per-Container CPU, Memory, Disk, Network)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # 3. Application Health Probe via Blackbox Exporter
  - job_name: "blackbox-http"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "http://web:80/up"
          - "http://web:80/"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox-exporter:9115"
